name: Build Windows EXE
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build installer
        shell: cmd
        run: |
          cd windows-kit
          call make-exe.bat
      - name: Check EXE exists
        shell: pwsh
        run: |
          if (!(Test-Path windows-kit/Sage-Programmers-Setup.exe)) { throw "EXE was not created" }
          New-Item -ItemType Directory -Force downloads | Out-Null
          Copy-Item windows-kit/Sage-Programmers-Setup.exe downloads/Sage-Programmers-Setup.exe -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Sage-Programmers-Setup
          path: downloads/Sage-Programmers-Setup.exe
      - name: Commit EXE to repo
        shell: pwsh
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f downloads/Sage-Programmers-Setup.exe
          git commit -m "Add built Windows installer"
          git push
