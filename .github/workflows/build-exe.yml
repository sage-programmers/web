name: Build Windows EXE
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build installer
        shell: cmd
        continue-on-error: true
        run: |
          cd windows-kit
          call make-exe.bat
      - name: Wait for EXE
        shell: pwsh
        run: |
          $p = "windows-kit/Sage-Programmers-Setup.exe"
          for ($i = 0; $i -lt 60 -and !(Test-Path $p); $i++) { Start-Sleep -Seconds 2 }
          if (!(Test-Path $p)) { throw "EXE was not created" }
          Start-Sleep -Seconds 3
          New-Item -ItemType Directory -Force downloads | Out-Null
          Copy-Item $p downloads/Sage-Programmers-Setup.exe -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Sage-Programmers-Setup
          path: downloads/Sage-Programmers-Setup.exe
      - name: Commit EXE to repo
        shell: pwsh
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f downloads/Sage-Programmers-Setup.exe
          git commit -m "Add built Windows installer"
          git push
